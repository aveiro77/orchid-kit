services:
  # Laravel Application (PHP 8.2)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orchid_kpmi_app
    #restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - orchid_kpmi_network
    depends_on:
      - mysql
      - redis

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: orchid_kpmi_nginx
    #restart: unless-stopped
    ports:
      - "8002:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - orchid_kpmi_network
    depends_on:
      - app

  # MySQL Database
  mysql:
    #image: mysql:8.0
    image: mariadb:10.5
    container_name: orchid_kpmi_mysql
    #restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: orchid_kpmi_db
      MYSQL_USER: orchid_kpmi
      MYSQL_PASSWORD: orchid_kpmi_password
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - orchid_kpmi_mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/my.cnf
    ports:
      - "3308:3306"
    networks:
      - orchid_kpmi_network

  # Redis Cache
  redis:
    image: redis:alpine
    container_name: orchid_kpmi_redis
    #restart: unless-stopped
    ports:
      - "6382:6379"
    networks:
      - orchid_kpmi_network


  node:
    image: node:20-alpine
    container_name: orchid_kpmi_node
    #restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./node_modules:/var/www/html/node_modules
    networks:
      - orchid_kpmi_network
    command: tail -f /dev/null


  # MailHog for Email Testing
  mailhog:
    image: mailhog/mailhog
    container_name: orchid_kpmi_mailhog
    #restart: unless-stopped
    ports:
      - "8027:8025"
      - "1027:1025"
    networks:
      - orchid_kpmi_network

networks:
  orchid_kpmi_network:
    driver: bridge

volumes:
  orchid_kpmi_mysql_data:
